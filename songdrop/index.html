<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add a song</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Add song">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f6f6f8; --card: #ffffff; --ink: #16161a; --muted: #6b6b76; --line: #e4e4ea;
    --accent: #4f46e5; --accent-ink: #ffffff; --good: #15803d; --good-bg: #e7f6ec;
    --bad: #b42318; --bad-bg: #fdecea; --wait: #8a5a00; --wait-bg: #fdf3dc; --track: #e4e4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101014; --card: #1a1a20; --ink: #f2f2f5; --muted: #9a9aa6; --line: #2a2a33;
      --accent: #7c74ff; --accent-ink: #0d0d12; --good: #5fd18a; --good-bg: #12301f;
      --bad: #ff8a80; --bad-bg: #3a1614; --wait: #f2c261; --wait-bg: #33280f; --track: #2a2a33;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
             calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 4px 0 2px; letter-spacing: -0.01em; }
  .lede { color: var(--muted); margin: 0 0 16px; font-size: 15px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .field { display: flex; gap: 8px; }
  input[type=url] {
    flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px; outline: none;
  }
  input[type=url]:focus, input[type=text]:focus, select:focus { border-color: var(--accent); }
  .found { display: flex; gap: 12px; align-items: center; margin: 12px 0 4px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 2px 5px; font-weight: 600; }
  input[type=text], select {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 12px; outline: none; -webkit-appearance: none; appearance: none;
  }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
           background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0; min-height: 16px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; -webkit-tap-highlight-color: transparent; }
  .paste { background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 0 14px; }
  .add {
    width: 100%; margin-top: 10px; padding: 15px; font-weight: 650; font-size: 17px;
    background: var(--accent); color: var(--accent-ink);
  }
  .add:disabled { opacity: 0.55; }
  .msg { margin: 10px 2px 0; font-size: 14.5px; min-height: 20px; }
  .msg.err { color: var(--bad); }
  .msg.ok { color: var(--good); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 26px 4px 8px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; gap: 12px; align-items: center; }
  .art {
    flex: none; width: 52px; height: 52px; border-radius: 9px; background: var(--track) center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted); font-size: 22px;
  }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 15.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-block; margin-top: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--wait-bg); color: var(--wait); }
  .pill.ready { background: var(--good-bg); color: var(--good); }
  .pill.failed, .pill.unknown { background: var(--bad-bg); color: var(--bad); }
  .bar { height: 5px; border-radius: 3px; background: var(--track); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.6s; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 4px; overflow-wrap: anywhere; }
  .side { flex: none; display: grid; gap: 6px; justify-items: end; }
  .open { color: var(--accent); font-weight: 600; font-size: 14px; text-decoration: none; padding: 6px 4px; }
  .x { background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 8px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 15px; }
  footer { margin-top: 22px; display: flex; gap: 18px; justify-content: center; font-size: 14px; }
  footer a { color: var(--muted); }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .art.busy { animation: pulse 1.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .art.busy { animation: none; } .bar > i { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Add a song</h1>
  <p class="lede">Paste a YouTube or YouTube Music link. It is saved as audio and shows here once it is in Jellyfin.</p>

  <form id="form" autocomplete="off">
    <div class="field">
      <input id="link" type="url" inputmode="url" enterkeyhint="go" placeholder="Paste the link here"
             autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Song link">
      <button type="button" class="paste" id="paste" hidden>Paste</button>
    </div>
    <div id="details" hidden>
      <div class="found">
        <div class="art" id="p-thumb">♪</div>
        <div class="body"><div class="title" id="p-title"></div><div class="sub" id="p-channel"></div></div>
      </div>
      <label for="artist">Artist</label>
      <input id="artist" type="text" placeholder="Leave empty to keep YouTube's" autocapitalize="words" autocorrect="off" spellcheck="false">
      <label for="playlist">Playlist</label>
      <select id="playlist"><option value="">No playlist</option></select>
      <div class="hint" id="p-hint"></div>
    </div>
    <button class="add" id="add" type="submit">Add to library</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </form>

  <h2>Recent</h2>
  <ul id="list"><li class="empty" style="display:block">Loading…</li></ul>

  <footer><a id="lnk-metube" href="#">MeTube queue</a><a id="lnk-jellyfin" href="#">Jellyfin</a></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const LABEL = {
  queued: 'Queued', downloading: 'Downloading', saved: 'Saved, waiting for Jellyfin',
  ready: 'In your library', failed: 'Failed', unknown: 'Not found', playlist: 'Playlist sent to MeTube'
};
const ACTIVE = new Set(['queued', 'downloading', 'saved']);
let timer = null, jellyfin = '', metube = '';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function say(text, kind) { const m = $('msg'); m.textContent = text || ''; m.className = 'msg' + (kind ? ' ' + kind : ''); }

function row(it) {
  const li = el('li');
  const art = el('div', 'art' + (ACTIVE.has(it.state) ? ' busy' : ''));
  if (it.state === 'ready' && it.cover_id) art.style.backgroundImage = `url("/api/cover/${it.cover_id}")`;
  else art.textContent = it.state === 'failed' || it.state === 'unknown' ? '!' : '♪';
  li.append(art);

  const body = el('div', 'body');
  body.append(el('div', 'title', it.state === 'ready' && it.name ? it.name : it.title));
  const who = it.state === 'ready' ? it.artist : it.want_artist;
  const where = it.playlist ? (it.playlisted ? 'in ' : 'for ') + it.playlist : '';
  if (who || where) body.append(el('div', 'sub', [who, where].filter(Boolean).join(' · ')));
  const pct = it.state === 'downloading' && it.percent != null ? ` ${it.percent}%` : '';
  const finishing = it.state === 'downloading' && it.percent >= 100;
  body.append(el('span', 'pill ' + it.state, finishing ? 'Converting to audio' : LABEL[it.state] + pct));
  if (it.state === 'downloading') { const bar = el('div', 'bar'), fill = el('i'); fill.style.width = (it.percent || 0) + '%'; bar.append(fill); body.append(bar); }
  if (it.note) body.append(el('div', 'note', it.note));
  li.append(body);

  const side = el('div', 'side');
  if (it.state === 'ready') { const a = el('a', 'open', 'Open'); a.href = `${jellyfin}/web/#/details?id=${it.item_id}`; a.target = '_blank'; a.rel = 'noopener'; side.append(a); }
  if (it.state === 'playlist') { const a = el('a', 'open', 'Queue'); a.href = metube; a.target = '_blank'; a.rel = 'noopener'; side.append(a); }
  if (it.state === 'failed' || it.state === 'unknown') { const b = el('button', 'open', 'Retry'); b.type = 'button'; b.onclick = () => submit(it.url); side.append(b); }
  const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', 'Remove from this list');
  x.onclick = async () => { await post('/api/remove', {key: it.key}); refresh(); };
  side.append(x);
  li.append(side);
  return li;
}

async function post(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

async function refresh() {
  clearTimeout(timer);
  let active = false;
  try {
    const data = await (await fetch('/api/items', {cache: 'no-store'})).json();
    jellyfin = data.jellyfin; metube = data.metube;
    $('lnk-jellyfin').href = jellyfin; $('lnk-metube').href = metube;
    const list = $('list');
    list.replaceChildren(...(data.items.length ? data.items.map(row) : [Object.assign(el('li', 'empty', 'Nothing added yet.'), {style: 'display:block'})]));
    active = data.items.some(i => ACTIVE.has(i.state));
  } catch (e) { /* keep the last list; try again below */ }
  if (!document.hidden) timer = setTimeout(refresh, active ? 2500 : 20000);
}

async function submit(text) {
  text = (text || '').trim();
  if (!text) { say('Paste a link first.', 'err'); $('link').focus(); return; }
  $('add').disabled = true; say('Sending to MeTube…');
  try {
    const known = looked === text;                 // only send choices that belong to this link
    const out = await post('/api/add', {text, artist: known ? $('artist').value : '', playlist_id: known ? $('playlist').value : ''});
    $('link').value = ''; resetDetails();
    say(out.duplicate === 'library' ? 'Already in your library. Not downloaded again.'
      : out.duplicate === 'downloading' ? 'Already downloading. Not added twice.'
      : out.kind === 'playlist' ? 'Playlist sent. Its songs show in the MeTube queue.'
      : 'Added. It will show below when it is ready.', 'ok');
  } catch (e) { say(e.message, 'err'); }
  $('add').disabled = false;
  refresh();
}

// Look the link up as soon as it is pasted: title, a guessed artist, a guessed playlist.
let looked = '', lookTimer = null;
function resetDetails() { looked = ''; $('details').hidden = true; $('artist').value = ''; $('playlist').value = ''; }
async function lookup() {
  const text = $('link').value.trim();
  if (!/https?:\/\/\S+/.test(text)) { resetDetails(); return; }
  if (text === looked) return;
  say('Looking up the link…');
  try {
    const p = await post('/api/preview', {text});
    if ($('link').value.trim() !== text) return;     // the box changed while we were asking
    looked = text;
    const sel = $('playlist');
    sel.replaceChildren(new Option('No playlist', ''), ...p.playlists.map(x => new Option(x.name, x.id)));
    sel.value = p.playlist_id || '';
    $('artist').value = p.artist || '';
    $('p-title').textContent = p.title || (p.kind === 'playlist' ? 'A whole playlist' : 'Link found');
    $('p-channel').textContent = p.channel ? 'Channel: ' + p.channel : '';
    const th = $('p-thumb'); th.style.backgroundImage = p.thumb ? `url("${p.thumb}")` : ''; th.textContent = p.thumb ? '' : '♪';
    const song = p.kind === 'song';
    $('artist').disabled = !song || p.duplicate === 'library'; sel.disabled = !song;
    $('p-hint').textContent = !song ? 'Artist and playlist can only be set for a single song.'
      : p.duplicate === 'library' ? 'Already in your library. Pick a playlist to add it there; the artist stays as it is.'
      : p.duplicate === 'downloading' ? 'Already downloading.'
      : p.playlist_id ? 'Playlist picked automatically. Change it if it is wrong.'
      : p.playlists.length ? 'Could not tell which playlist. Pick one, or leave it out.' : '';
    $('details').hidden = false; say('');
  } catch (e) { resetDetails(); say(e.message, 'err'); }
}
$('link').addEventListener('input', () => { clearTimeout(lookTimer); lookTimer = setTimeout(lookup, 350); });

$('form').addEventListener('submit', e => { e.preventDefault(); submit($('link').value); });
if (navigator.clipboard && navigator.clipboard.readText) {
  $('paste').hidden = false;
  $('paste').onclick = async () => { try { $('link').value = await navigator.clipboard.readText(); } catch (e) { $('link').focus(); } };
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

// A share shortcut opens this page as  /?url=<link>  (or ?text=...): add it straight away.
// Everything after "url=" is taken as the link, so it works whether or not the helper encoded it.
const hit = location.search.match(/[?&](?:url|text|link)=(.*)$/);
let shared = hit ? hit[1] : '';
if (/^https?%3A/i.test(shared) || !/^https?:/i.test(shared)) { try { shared = decodeURIComponent(shared.replace(/\+/g, ' ')); } catch (e) {} }
// A shared link is filled in and looked up, then waits for one tap so the artist and playlist can be checked.
if (shared) { history.replaceState(null, '', '/'); $('link').value = shared; lookup(); }
refresh();
</script>
</body>
</html>
